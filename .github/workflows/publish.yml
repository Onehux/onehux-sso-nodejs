# .github/workflows/publish.yml
# Publishes @onehux/sso to npm. Fires only when a GitHub Release is published, never on an
# ordinary push, so creating the Release itself is the real confirmation step for this
# irreversible action. Requires an npm Automation token added as the NPM_TOKEN repo secret,
# scoped to the @onehux org.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

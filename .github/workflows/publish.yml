# .github/workflows/publish.yml
# Publishes @onehux/sso to npm via Trusted Publishing (OIDC) — no stored token. Fires only when
# a GitHub Release is published, never on an ordinary push, so creating the Release itself is
# the real confirmation step for this irreversible action.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}  # TEMPORARY — for OIDC verification only, removed right after

permissions:
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm publish --access public
